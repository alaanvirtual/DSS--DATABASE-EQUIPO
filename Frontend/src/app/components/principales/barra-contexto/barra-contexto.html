<div class="contexto">
  <app-campo-select
    etiqueta="Proyecto"
    [opciones]="proyectos()"
    [valor]="servicio.idproy()"
    (valorChange)="alProyecto($event)"
  />
  <app-campo-select
    etiqueta="Participando como"
    [opciones]="usuarios()"
    [valor]="servicio.idusuario()"
    (valorChange)="alUsuario($event)"
  />
  <app-campo-select
    etiqueta="Tópico de categorización"
    [opciones]="topicos()"
    [valor]="servicio.idtopico()"
    [deshabilitado]="topicos().length === 0"
    (valorChange)="alTopico($event)"
  />
  @if (servicio.rolActual(); as rol) {
    <app-insignia [variante]="rol === 'FAC' ? 'primario' : 'info'">
      {{ rol === 'FAC' ? 'Facilitador' : 'Decisor' }}
    </app-insignia>
  }
</div>
