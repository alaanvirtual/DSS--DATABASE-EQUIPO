<button
  class="boton"
  [class]="'boton boton--' + variante()"
  [class.boton--solo-icono]="soloIcono()"
  [class.boton--grande]="grande()"
  [type]="tipo()"
  [disabled]="deshabilitado() || cargando()"
  [attr.aria-busy]="cargando() ? 'true' : null"
  [attr.aria-label]="etiquetaAria()"
>
  @if (cargando()) {
    <span class="boton__rueda" aria-hidden="true"></span>
  } @else if (icono(); as nombre) {
    <app-icono [nombre]="nombre" />
  }
  <ng-content />
</button>
