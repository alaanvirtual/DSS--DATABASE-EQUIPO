<label class="campo">
  <span class="campo__etiqueta" [class.campo__etiqueta--oculta]="ocultarEtiqueta()">{{
    etiqueta()
  }}</span>
  <select class="campo__control" [disabled]="deshabilitado()" (change)="cambiar($event)">
    @if (marcador(); as texto) {
      <option value="" [selected]="valor() === null">{{ texto }}</option>
    }
    @for (opcion of opciones(); track opcion.valor) {
      <option [value]="opcion.valor" [selected]="opcion.valor === valor()">
        {{ opcion.texto }}
      </option>
    }
  </select>
</label>
